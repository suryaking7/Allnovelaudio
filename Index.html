<!DOCTYPE html>
<html>
<head>
  <title>All Novel Audio - Login</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 250px;
    }
    button {
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Login Required</h2>

<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyC...TWBV",
    authDomain: "allnovelaudio-d2282.firebaseapp.com",
    projectId: "allnovelaudio-d2282",
    storageBucket: "allnovelaudio-d2282.appspot.com",
    messagingSenderId: "525510523414",
    appId: "1:525510523414:web:76b05294a29ef1af5d337"
  };
  firebase.initializeApp(firebaseConfig);

  function login() {
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = "home.html";
      })
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
